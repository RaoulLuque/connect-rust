# fly.toml app configuration file generated for connect-rust on 2023-12-28T11:45:38+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Command for deploying
# /home/raoul/.fly/bin/flyctl deploy

app = "connect-rust"
primary_region = "fra"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
  swap_size_mb = 512

[build]
  dockerfile = 'Dockerfile'